name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: 22
  POSTGRES_DB: reporting_test
  POSTGRES_USER: postgres
  POSTGRES_HOST_AUTH_METHOD: trust
  DATABASE_URL: postgresql://postgres@localhost:5432/reporting_test
  REDIS_URL: redis://localhost:6379
  VITE_API_URL: /api
  VITE_USE_COOKIE_AUTH: true
  USE_MATERIALIZED_VIEWS: false

jobs:
  # Validation Stage
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate commit messages
        if: github.event_name == 'push'
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          npm install -g @commitlint/cli @commitlint/config-conventional
          printf '%s' "$COMMIT_MESSAGE" | commitlint --config commitlint.config.js

      - name: Validate PR commit messages
        if: github.event_name == 'pull_request'
        run: |
          npm install -g @commitlint/cli @commitlint/config-conventional
          npx commitlint --from ${{ github.event.pull_request.base.sha }} --to HEAD --config commitlint.config.js

  # Build Stage
  build-backend:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          cd backend
          npm ci --prefer-offline

      - name: Lint and type check
        run: |
          cd backend
          npm run lint -- --max-warnings 10
          npm run typecheck

      - name: Build
        run: |
          cd backend
          npm run build
          # Remove source maps and type definitions to reduce artifact size
          find dist -name "*.map" -delete 2>/dev/null || true
          find dist -name "*.d.ts" -delete 2>/dev/null || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: |
            backend/dist/
            !backend/dist/**/*.map
            !backend/dist/**/*.d.ts
            !backend/dist/**/*.test.js
          retention-days: 7

  build-frontend:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci --prefer-offline

      - name: Lint and type check
        run: |
          cd frontend
          npm run lint -- --max-warnings 10
          npm run type-check

      - name: Build
        run: |
          cd frontend
          npm run build
          # Remove source maps to reduce artifact size
          find build -name "*.map" -delete 2>/dev/null || true
          find build -name "*.txt" -delete 2>/dev/null || true
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}
          VITE_USE_COOKIE_AUTH: ${{ env.VITE_USE_COOKIE_AUTH }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            frontend/build/
            !frontend/build/**/*.map
            !frontend/build/**/*.txt
            !frontend/build/static/media/*.map
          retention-days: 7

  # Test Stage
  test-backend:
    runs-on: ubuntu-latest
    needs: build-backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: reporting_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: backend/

      - name: Install dependencies
        run: |
          cd backend
          npm ci --prefer-offline

      - name: Bootstrap database schema
        run: |
          cd backend
          npm run migrate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          NODE_ENV: test

      - name: Run tests with coverage
        run: |
          cd backend
          npm run test:coverage
          # Remove large coverage files to reduce artifact size
          rm -rf coverage/lcov-report coverage/tmp 2>/dev/null || true
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          REDIS_URL: ${{ env.REDIS_URL }}
          JWT_SECRET: test-jwt-secret
          NODE_ENV: test

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  test-backend-e2e:
    runs-on: ubuntu-latest
    needs: build-backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: reporting_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          cd backend
          npm ci --prefer-offline

      - name: Bootstrap database schema
        run: |
          cd backend
          npm run migrate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          NODE_ENV: test

      - name: Run backend E2E tests
        run: |
          cd backend
          npm run test:e2e:ci
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          REDIS_URL: ${{ env.REDIS_URL }}
          JWT_SECRET: test-jwt-secret
          NODE_ENV: test
          CI: true

  test-frontend:
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/

      - name: Install dependencies
        run: |
          cd frontend
          npm ci --prefer-offline

      - name: Run tests with coverage
        run: |
          cd frontend
          npm run test:coverage -- --run
          # Remove large coverage files to reduce artifact size
          rm -rf coverage/html coverage/tmp 2>/dev/null || true
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}
          VITE_USE_COOKIE_AUTH: ${{ env.VITE_USE_COOKIE_AUTH }}
          VITE_AZURE_CLIENT_ID: test-client-id
          VITE_AZURE_TENANT_ID: test-tenant-id

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  # Security Stage
  security-scan:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for secret scanning

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Security audit - Dependencies
        run: |
          cd backend
          npm ci --prefer-offline
          npm audit --audit-level=moderate
          cd ../frontend
          npm ci --prefer-offline
          npm audit --audit-level=moderate

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # E2E Tests (Optional - can be resource intensive)
  e2e-tests:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: reporting_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Playwright
        run: |
          cd frontend
          npm ci --prefer-offline
          npx playwright install --with-deps chromium firefox

      - name: Run E2E tests
        run: |
          cd frontend
          npm run test:e2e:ci
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          REDIS_URL: ${{ env.REDIS_URL }}
          JWT_SECRET: test-jwt-secret
          NODE_ENV: test
          CI: true
          VITE_API_URL: ${{ env.VITE_API_URL }}
          VITE_USE_COOKIE_AUTH: ${{ env.VITE_USE_COOKIE_AUTH }}
          VITE_AZURE_CLIENT_ID: test-client-id
          VITE_AZURE_TENANT_ID: test-tenant-id
        timeout-minutes: 30

      - name: Upload E2E results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7

  # Docker image build and scan
  build-images:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, test-backend]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: production
          push: false
          load: true
          tags: simpleadminreporter-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan backend image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: simpleadminreporter-backend:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          target: production
          push: false
          load: true
          tags: simpleadminreporter-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan frontend image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: simpleadminreporter-frontend:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library

  # Deployment placeholder (customize based on your infrastructure)
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build-images, security-scan]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          ./scripts/deploy.sh staging
          ./scripts/health-check.sh

  deploy-production:
    runs-on: ubuntu-latest
    needs: [build-images, security-scan, e2e-tests, test-backend-e2e]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          ./scripts/deploy.sh production
          ./scripts/health-check.sh
          ./scripts/verify-backups.sh || echo "Backup verification skipped in CI"
