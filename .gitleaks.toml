title = "SimpleAdminReporter Security Scanner"

[extend]
useDefault = true

[allowlist]
description = "Generated artifacts and verified public test fixtures"
paths = [
    '''(^|/)(node_modules|coverage|lcov-report|test-results|build|dist)/''',
    '''(^|/)package-lock\.json$''',
    '''(^|/)(current-leaks|gitleaks-report|final-leaks|new-gitleaks-report|test-gitleaks-report)\.json$''',
]
regexes = [
    '''AKIAIMNOJVGFDXXXE4OA''',
    '''dGVzdC1lbmNyeXB0aW9uLWtleS0zMi1jaGFyYWN0ZXJzLW1pbmltdW0tZm9yLXRlc3Q=''',
]
